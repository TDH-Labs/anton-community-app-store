services:
  app_proxy:
    environment:
      APP_HOST: anton_app_1
      APP_PORT: "3080"
      # Anton's Ops Center already sits behind its own first-boot password
      # gate, so skip umbrelOS' additional proxy auth layer.
      PROXY_AUTH_ADD: "false"
  app:
    # Pinned to the verified build of main@46516ead3453805ee870a4ac8317cd6eed0f4932
    # (CI-green). Bump this digest together with `version` on every release --
    # that bump is what generates users' update notifications.
    image: ghcr.io/tdh-labs/anton@sha256:ea1ccb727225e4dafd1706e854c8dc072ad6ef8493ccd4069a92dec711225ca3
    restart: unless-stopped
    # No host port bindings: umbrelOS proxies the container's :3080 through
    # the app_proxy service above, per umbrel-app.yml's `port: 3080`.
    volumes:
      - anton_data:/data
    environment:
      - ANTON_EXECUTOR=${ANTON_EXECUTOR:-pi}
      - ANTON_DATA_DIR=/data
      - ANTON_PORT=8799
      - ANTON_SERVE_PORT=8798
      - ANTON_WEB_INTERNAL_PORT=3079
      - ANTON_WEB_PORT=3080
      # Login password auto-generates on first boot and is shown once on the
      # login page. Set ANTON_WEB_TOKEN only if you need a known value.
      - ANTON_WEB_TOKEN=${ANTON_WEB_TOKEN:-}
      - ANTON_DASHBOARD_TOKEN=${ANTON_DASHBOARD_TOKEN:-}
    # Mirrors the Dockerfile's HEALTHCHECK -- probes the job engine's real
    # /health endpoint inside the container, not just the login page render.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8799/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
volumes:
  anton_data:
